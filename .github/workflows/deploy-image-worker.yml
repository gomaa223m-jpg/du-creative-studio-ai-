name: Deploy image generation Worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-image-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Validate configuration and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
      IMAGE_ENGINE_URL: ${{ secrets.IMAGE_ENGINE_URL }}
      IMAGE_CHECKPOINT: ${{ vars.IMAGE_CHECKPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment settings
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("GitHub Secret: CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("GitHub Secret: CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$APP_ACCESS_TOKEN" ]] || missing+=("GitHub Secret: APP_ACCESS_TOKEN")
          [[ -n "$IMAGE_ENGINE_URL" ]] || missing+=("GitHub Secret: IMAGE_ENGINE_URL")
          [[ -n "$IMAGE_CHECKPOINT" ]] || missing+=("GitHub Variable: IMAGE_CHECKPOINT")
          if (( ${#missing[@]} )); then
            printf '::error::Worker deployment blocked. Configure these repository settings:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          case "$IMAGE_ENGINE_URL" in
            https://*) ;;
            *) echo "::error::IMAGE_ENGINE_URL must be a protected HTTPS URL."; exit 1 ;;
          esac

      - name: Deploy Worker and apply image engine configuration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            APP_ACCESS_TOKEN
            IMAGE_ENGINE_URL
          vars: |
            IMAGE_CHECKPOINT
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}
          IMAGE_ENGINE_URL: ${{ env.IMAGE_ENGINE_URL }}
          IMAGE_CHECKPOINT: ${{ env.IMAGE_CHECKPOINT }}
