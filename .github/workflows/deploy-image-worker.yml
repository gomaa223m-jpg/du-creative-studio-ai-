name: Deploy EDU Creative Studio Worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "wrangler.video.toml"
      - ".github/workflows/deploy-image-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure educational Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$APP_ACCESS_TOKEN" ]] || missing+=("APP_ACCESS_TOKEN")
          if (( ${#missing[@]} )); then
            {
              echo "## Deployment blocked: missing required secrets"
              echo
              echo "Add these in Settings → Secrets and variables → Actions:"
              for name in "${missing[@]}"; do echo "- `$name`"; done
              echo
              echo "No secrets are printed or exposed by this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment blocked. Configure the required GitHub Actions secrets listed in the job summary."
            exit 1
          fi

      - name: Validate Worker JavaScript
        run: node --input-type=module --check < worker/index.js

      - name: Deploy Worker core
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            APP_ACCESS_TOKEN
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}

      - name: Enable optional cloud text generation
        if: env.OPENAI_API_KEY != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            APP_ACCESS_TOKEN
            OPENAI_API_KEY
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      - name: Deploy optional video AI gateway
        if: env.AI_API_KEY != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.video.toml
          secrets: |
            APP_ACCESS_TOKEN
            AI_API_KEY
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}
          AI_API_KEY: ${{ env.AI_API_KEY }}

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Worker deployed successfully"
            echo
            echo "- Core Worker endpoints are deployed."
            if [[ -n "$OPENAI_API_KEY" ]]; then
              echo "- Cloud text generation secret is configured."
            else
              echo "- Cloud text generation is disabled; local browser tools remain available."
            fi
            echo "- Book engine: edu-creative-book-engine.<your-account-subdomain>.workers.dev"
            if [[ -n "$AI_API_KEY" ]]; then
              echo "- Video AI gateway: https://edu-creative-video-gateway.<your-account-subdomain>.workers.dev"
              echo "- In the Studio, use the video gateway URL with /api/generate and the same APP_ACCESS_TOKEN."
            else
              echo "- Video cloud gateway skipped: add AI_API_KEY to enable it; local video scripting remains available."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
