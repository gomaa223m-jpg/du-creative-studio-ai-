name: Deploy EDU Creative Studio Worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "wrangler.video.toml"
      - ".github/workflows/deploy-image-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure educational Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      IMAGE_ENGINE_URL: ${{ secrets.IMAGE_ENGINE_URL }}
      IMAGE_ENGINE_TOKEN: ${{ secrets.IMAGE_ENGINE_TOKEN }}
      IMAGE_CHECKPOINT: ${{ vars.IMAGE_CHECKPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker JavaScript
        run: |
          node --input-type=module --check < worker/index.js
          node --input-type=module --check < worker/ai-gateway.js

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Account ID from the target Cloudflare account."
            exit 1
          fi
          [[ -n "$APP_ACCESS_TOKEN" ]] || missing+=("APP_ACCESS_TOKEN")
          if (( ${#missing[@]} )); then
            {
              echo "## Deployment blocked: missing required secrets"
              echo
              echo "Add these in Settings → Secrets and variables → Actions → Repository secrets:"
              for name in "${missing[@]}"; do printf '%s\n' "- $name"; done
              echo
              echo "Values are never printed by this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment blocked. Configure the required GitHub Actions secrets listed in the job summary."
            exit 1
          fi

      - name: Deploy Worker core
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            APP_ACCESS_TOKEN
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}

      - name: Enable optional cloud text generation
        if: env.OPENAI_API_KEY != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            APP_ACCESS_TOKEN
            OPENAI_API_KEY
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      - name: Deploy optional video AI gateway
        if: env.AI_API_KEY != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.video.toml
          secrets: |
            APP_ACCESS_TOKEN
            AI_API_KEY
        env:
          APP_ACCESS_TOKEN: ${{ env.APP_ACCESS_TOKEN }}
          AI_API_KEY: ${{ env.AI_API_KEY }}

      - name: Configure optional image engine secrets
        if: env.IMAGE_ENGINE_URL != '' && env.IMAGE_CHECKPOINT != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            IMAGE_ENGINE_URL
            IMAGE_CHECKPOINT
        env:
          IMAGE_ENGINE_URL: ${{ env.IMAGE_ENGINE_URL }}
          IMAGE_CHECKPOINT: ${{ env.IMAGE_CHECKPOINT }}

      - name: Configure optional image engine access token
        if: env.IMAGE_ENGINE_TOKEN != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
          secrets: |
            IMAGE_ENGINE_TOKEN
        env:
          IMAGE_ENGINE_TOKEN: ${{ env.IMAGE_ENGINE_TOKEN }}

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Worker deployment completed"
            echo
            echo "- Core Worker deployed."
            echo "- Private application access token configured."
            if [[ -n "$OPENAI_API_KEY" ]]; then
              echo "- Cloud text generation configured."
            else
              echo "- Cloud text generation is disabled; local browser tools remain available."
            fi
            echo "- Core Worker: edu-creative-book-engine.<your-account-subdomain>.workers.dev"
            if [[ -n "$AI_API_KEY" ]]; then
              echo "- Video script gateway deployed: https://edu-creative-video-gateway.<your-account-subdomain>.workers.dev"
              echo "- This gateway creates video scripts and scene plans; it does not render final MP4 files."
            else
              echo "- Optional video script gateway skipped: add AI_API_KEY to enable it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
