<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDU CREATIVE STUDIO AI</title><style>body{font-family:Tahoma,Arial;background:#f3f7fa;color:#182b3b;margin:0;line-height:1.8}header{background:linear-gradient(120deg,#10243a,#176b9b,#16a89a);color:white;padding:38px 20px}main{max-width:900px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce6ed;border-radius:16px;padding:22px;margin:16px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd9e2;border-radius:9px;font:inherit}button{background:#16a89a;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;background:#f8fbfd;padding:16px;border-radius:10px;min-height:160px}</style><header><h1>EDU CREATIVE STUDIO AI</h1><p>استوديو مستر محمد جمعة لصناعة المحتوى التعليمي</p></header><main><section class="card"><h2>أنشئ مشروعك التعليمي</h2><label>عنوان الدرس</label><input id="topic" placeholder="مثال: الحساب الكيميائي"><label>المادة والصف</label><input id="grade" placeholder="مثال: كيمياء ثاني ثانوي"><label>نوع المخرج</label><select id="kind"><option>محتوى تعليمي</option><option>عرض تقديمي</option><option>فيديو تعليمي</option><option>إنفوجرافيك</option><option>ورقة عمل</option><option>حزمة درس متكاملة</option></select><label>تفاصيل إضافية</label><textarea id="notes" placeholder="أهداف الدرس، عدد الشرائح، شروط التصميم..."></textarea><button id="make">إنشاء البرومبت</button> <button id="ai">إنشاء المحتوى عبر ChatGPT</button></section><section class="card"><h2>الناتج</h2><pre id="out">أدخل البيانات ثم ابدأ.</pre><button id="copy">نسخ النص</button><p>إنشاء البرومبت مجاني ويعمل داخل الصفحة. زر ChatGPT يحتاج إعداد خادم آمن ومفتاح API في الاستضافة؛ لا تضع المفتاح هنا أو في GitHub. استخدام API قد يترتب عليه رسوم منفصلة.</p></section></main><script>function build(){return 'أنت EDU CREATIVE STUDIO AI، متخصص في إنتاج محتوى تعليمي عربي دقيق وممتع.\nالموضوع: '+(topic.value||'حدد الموضوع')+'\nالمرحلة/المادة: '+(grade.value||'حدد الصف والمادة')+'\nالمخرج: '+kind.value+'\nتفاصيل: '+(notes.value||'لا توجد')+'\n\nأنجز المطلوب كاملاً مع مراجعة الدقة العلمية واللغوية، واستخدم العربية الفصحى واتجاه RTL، وراعِ عمر المتعلم، ولا تختلق مراجع أو معلومات. أدرج عند الحاجة: إعداد مستر محمد جمعة. الشعار: معانا دائماً أنت الأفضل.'}make.onclick=()=>out.textContent=build();copy.onclick=()=>navigator.clipboard.writeText(out.textContent);ai.onclick=async()=>{out.textContent='جارٍ الاتصال بالخادم...';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:build()})});let d=await r.json();if(!r.ok)throw Error(d.error||'الخادم غير جاهز');out.textContent=d.output||'لا يوجد ناتج'}catch(e){out.textContent='تعذر الاتصال: '+e.message+'\nيمكنك نسخ البرومبت واستخدامه مباشرة.'}}</script></html>
